<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2942"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Subtle Outer Border -->
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.3"/>

  <!-- Central Emblem Shield/Circle -->
  <circle cx="256" cy="220" r="140" fill="#0A1929" stroke="url(#gold)" stroke-width="8"/>

  <!-- AC Snowflake / Fan elements -->
  <g transform="translate(256, 170) scale(0.9)" stroke="url(#blueGlow)" stroke-width="7" stroke-linecap="round">
    <line x1="0" y1="-45" x2="0" y2="45"/>
    <line x1="-39" y1="-22.5" x2="39" y2="22.5"/>
    <line x1="-39" y1="22.5" x2="39" y2="-22.5"/>
    <!-- Snowflake branchlets -->
    <path d="M-12 -33 L0 -45 L12 -33" fill="none"/>
    <path d="M-12 33 L0 45 L12 33" fill="none"/>
    <path d="M35 -8 L39 -22.5 L24 -24" fill="none"/>
    <path d="M-35 8 L-39 22.5 L-24 24" fill="none"/>
  </g>

  <!-- Washing Machine Drum Waves / Whirlpool Arc -->
  <path d="M180,240 C190,285 240,305 285,290 C325,275 340,230 330,200" 
        fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="245" r="14" fill="url(#gold)"/>

  <!-- Company Name & Location Ribbon Banner -->
  <rect x="76" y="380" width="360" height="64" rx="14" fill="url(#gold)"/>
  <text x="256" y="415" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#0F2942" text-anchor="middle" letter-spacing="1">MADAR AL-TASIS</text>
  <text x="256" y="434" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#1E3A8A" text-anchor="middle" letter-spacing="2">MAKKAH • AC &amp; WASHING</text>
</svg>
